{% extends "base.html" %}
{% block title %}New Order{% endblock %}
{% block content %}
<h2 class="text-center" style="color:#837FB3;">Nuevo Pedido 📝</h2>
<form method="POST" action="/checkout" id="orderForm">
    <div class="mb-3">
        <label class="form-label">Nombre TikTok:</label>
        <input type="text" name="name" class="form-control" required>
    </div>
    <div class="d-flex flex-wrap justify-content-center gap-2">
        {% for product, price in products.items() %}
            <button type="button" class="btn btn-primary" onclick="addProduct('{{product}}', {{price}})">
                {{product}} ({{price}})
            </button>
        {% endfor %}
    </div>
    <table class="table table-bordered mt-4" id="table">
        <tr><th>Producto</th><th>Cantidad</th><th>Subtotal</th></tr>
    </table>
    <h3>Total: <span id="total">0</span></h3>
    <input type="hidden" name="detail" id="detail">
    <input type="hidden" name="total" id="totalFinal">
    <button type="submit" class="btn btn-success mt-3">Checkout</button>
</form>
{% endblock %}
