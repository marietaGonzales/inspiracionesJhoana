{% extends "base.html" %}
{% block title %}Catálogo{% endblock %}
{% block content %}
<h2 class="text-center">📋 Catálogo de Productos</h2>

<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>Producto</th>
            <th>Precio de Venta</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td>{{ item_map[product.product_id] }}</td>
            <td>{{ product.price_to_sell }} Bs</td>
            <td>
                <a href="/edit_product/{{ product.id }}" class="btn btn-warning btn-sm">✏️ Editar</a>
                <a href="/delete_product/{{ product.id }}" class="btn btn-danger btn-sm">🗑️ Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
