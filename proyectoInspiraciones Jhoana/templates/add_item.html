{% extends "base.html" %}
{% block title %}Crear Item{% endblock %}
{% block content %}
<h2 class="text-center">➕ Crear Item</h2>
<form method="POST" action="/add_item">
    <div class="row mb-3">
        <div class="col">
            <label class="form-label">Nombre del Item:</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="col">
            <label class="form-label">Proveedor:</label>
            <input type="text" name="provider" class="form-control" required>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea class="form-control" name="short_description" aria-label="Descripción"></textarea>
    </div>
   <div class="row mb-3">
        <div class="col">
            <label class="form-label">Cantidad:</label>
            <input type="number" step="1" min="1" name="quantity" id="quantity" class="form-control" required>
        </div>
        <div class="col">
            <label class="form-label">Total (Bs):</label>
            <input type="number" step="0.01" name="total" id="total" class="form-control" required>
        </div>
    <div class="col">
            <label class="form-label">Precio Unitario (Bs):</label>
            <input type="number" step="0.01" name="unitary_price" id="unitary_price" class="form-control" readonly>
        </div>
   </div>
    <div class="row mb-3">
        <div class="col">
            <label class="form-label">Fecha de Compra:</label>
            <input type="date" name="time_of_purchase" class="form-control" required>
        </div>
    </div>
    <button type="submit" class="btn btn-success">Guardar</button>
</form>

<script>
    const quantityInput = document.getElementById("quantity");
    const totalInput = document.getElementById("total");
    const unitaryPriceInput = document.getElementById("unitary_price");

    function updateUnitaryPrice() {
        const quantity = parseFloat(quantityInput.value) || 0;
        const total = parseFloat(totalInput.value) || 0;
        if (quantity > 0) {
            unitaryPriceInput.value = (total / quantity).toFixed(2);
        } else {
            unitaryPriceInput.value = "";
        }
    }

    quantityInput.addEventListener("input", updateUnitaryPrice);
    totalInput.addEventListener("input", updateUnitaryPrice);
</script>
{% endblock %}
